<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CaLẻ - Kiến làm việc">
  <!-- Full orange background -->
  <circle cx="32" cy="32" r="32" fill="#FF9A5F"/>

  <!-- Ant head (dark) -->
  <circle cx="32" cy="16" r="6.5" fill="#2C2C2C"/>

  <!-- Left antenna (curved) -->
  <path d="M 28 11 Q 22 6 19 0" stroke="#2C2C2C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right antenna (curved) -->
  <path d="M 36 11 Q 42 6 45 0" stroke="#2C2C2C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left eye (big, cute with shine) -->
  <circle cx="28" cy="15" r="2.5" fill="#ffffff"/>
  <circle cx="28" cy="15" r="1.6" fill="#2C2C2C"/>
  <circle cx="28.8" cy="14" r="0.7" fill="#ffffff"/>

  <!-- Right eye (big, cute with shine) -->
  <circle cx="36" cy="15" r="2.5" fill="#ffffff"/>
  <circle cx="36" cy="15" r="1.6" fill="#2C2C2C"/>
  <circle cx="36.8" cy="14" r="0.7" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M 30 19 Q 32 20.5 34 19" stroke="#2C2C2C" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Thorax/chest connector (dark) -->
  <ellipse cx="32" cy="26" rx="5.5" ry="3.5" fill="#2C2C2C"/>

  <!-- Abdomen/backpack (orange) -->
  <ellipse cx="32" cy="38" rx="8" ry="10" fill="#ea580c"/>

  <!-- Backpack shine/highlight -->
  <ellipse cx="32" cy="34" rx="7" ry="6" fill="#FF9A5F" opacity="0.5"/>

  <!-- Left front leg -->
  <path d="M 27 28 L 18 36" stroke="#2C2C2C" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Right front leg -->
  <path d="M 37 28 L 46 36" stroke="#2C2C2C" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Left back leg -->
  <path d="M 26 36 L 16 48" stroke="#2C2C2C" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Right back leg -->
  <path d="M 38 36 L 48 48" stroke="#2C2C2C" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Feet (small circles) -->
  <circle cx="18" cy="37" r="0.9" fill="#2C2C2C"/>
  <circle cx="46" cy="37" r="0.9" fill="#2C2C2C"/>
  <circle cx="16" cy="49" r="0.9" fill="#2C2C2C"/>
  <circle cx="48" cy="49" r="0.9" fill="#2C2C2C"/>
</svg>
